name: ci

# Backstop for the recon scripts: the self-test suite AND ShellCheck (pinned v0.10.0,
# --severity=style) are both hard gates. The scripts are verified clean at that level.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    name: scripts self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep (the scripts' preferred backend)
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Syntax-check every script (bash -n)
        run: for f in scripts/*.sh tests/run.sh; do bash -n "$f"; done
      - name: Grepper self-test suite
        run: bash tests/run.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck v0.10.0 (pinned so CI matches local results)
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ
          sudo install -m 0755 shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: ShellCheck (blocking — clean at --severity=style)
        run: shellcheck --severity=style scripts/*.sh tests/run.sh
